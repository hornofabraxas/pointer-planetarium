# Tests, the Pebble build and its size report on every push and pull
# request. A release (the .pbw, the CHANGELOG section and the size report)
# is published for "v" + package.json's version (v0.10, v1.0), either:
#   - on a push to main whose version has no tag yet: the release makes the
#     tag on that commit (so bumping the version on main is how to ship), or
#   - on pushing that tag yourself.
# A later push to main for a version already released only refreshes its
# notes from the CHANGELOG, as long as the app is unchanged since the tag.
# (A tag the release makes doesn't start another run: GitHub doesn't run
# workflows for pushes made with the workflow's own token.)
#
# The tool and SDK versions are pinned so a release builds the same way
# twice; bump them here (pebble sdk list shows what's available).
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cut a release off halfway.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

env:
  PEBBLE_TOOL_VERSION: '5.0.40'
  PEBBLE_SDK_VERSION: '4.33.1'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Phone-side tests
        run: |
          fail=0
          for t in test/*.test.js; do
            echo "::group::$t"
            node "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: Pictures match their sources
        run: python3 tools/make_art.py --check && python3 tools/make_craft.py --check
      - name: Install the ARM compiler for the watch-code checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Watch-code checks and C tests
        run: sh tools/check_c.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version ($want)"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v7
      - name: Install pebble-tool and the SDK
        run: |
          uv tool install "pebble-tool==$PEBBLE_TOOL_VERSION"
          pebble sdk install "$PEBBLE_SDK_VERSION"
      # pebble build names the .pbw after the checkout's folder (the repo's
      # name, here): one fixed name from here on, whatever the folder.
      - name: pebble build
        run: |
          pebble build
          for f in build/*.pbw; do
            [ "$f" = build/pointer-planetarium.pbw ] || mv "$f" build/pointer-planetarium.pbw
          done
      - name: Size report
        run: |
          python3 tools/size_report.py build/pointer-planetarium.pbw > size.md
          cat size.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: pointer-planetarium-${{ github.sha }}
          path: |
            build/pointer-planetarium.pbw
            size.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pointer-planetarium-${{ github.sha }}
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          pbw="dist/pointer-planetarium-$tag.pbw"
          mv dist/build/pointer-planetarium.pbw "$pbw"
          # This version's CHANGELOG section, then the size report. ("" makes
          # awk compare strings: as numbers, 0.1 and 0.10 are equal.)
          awk -v v="$version" '
            /^## / { on = ($2 "" == v ""); if (on) next }
            on' CHANGELOG.md > notes.md
          { echo; cat dist/size.md; } >> notes.md
          if [ "$GITHUB_REF_TYPE" = branch ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            # main, a version already released: its .pbw stays, but the notes
            # follow the CHANGELOG while the app itself is unchanged since.
            git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            if git diff --quiet "$tag" HEAD -- src resources package.json wscript; then
              gh release edit "$tag" --notes-file notes.md
              echo "$tag already released: notes refreshed"
            else
              echo "$tag already released, and the app has changed since: bump the version to release it"
            fi
          elif gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$pbw" --clobber
            gh release edit "$tag" --notes-file notes.md
          elif [ "$GITHUB_REF_TYPE" = branch ]; then
            gh release create "$tag" "$pbw" --target "$GITHUB_SHA" --title "Pointer Planetarium $version" --notes-file notes.md
          else
            gh release create "$tag" "$pbw" --verify-tag --title "Pointer Planetarium $version" --notes-file notes.md
          fi
